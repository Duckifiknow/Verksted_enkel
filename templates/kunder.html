<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>

<body>

    {% extends "base.html" %}
    {% block content %}

    <h1>Kunder i verkstedet</h1>

    <table>
        <caption>Registrerte kunder</caption>
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Navn</th>
                <th scope="col">E-post</th>
                <th scope="col">Telefon</th>
            </tr>
        </thead>
        <tbody> {% for kunde in kunder %} <tr>
                <td>{{ kunde.kunde_id }}</td>
                <td>{{ kunde.navn }}</td>
                <td>{{ kunde.epost }}</td>
                <td>{{ kunde.telefon }}</td>
            </tr> {% endfor %} </tbody>
    </table>

    {% endblock %}
    
</body>

</html>
